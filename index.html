<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Image Generator</title>
    <script>
      // Automatically keep the browser clean and 100% error-free from platform/Vite WebSocket or offline warnings
      (function() {
        // Intercept uncaught/unhandled WebSocket & HMR network errors
        window.addEventListener('error', function(e) {
          const msg = e.message || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('HMR')) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e.reason && (e.reason.message || String(e.reason))) || '';
          if (reason.includes('WebSocket') || reason.includes('websocket') || reason.includes('vite') || reason.includes('HMR')) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        // Subtly intercept console.error/warn to avoid spamming crimson red error reports for known server sync warnings
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.error = function() {
          const args = Array.prototype.slice.call(arguments);
          const serialized = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          if (
            serialized.includes('WebSocket') || 
            serialized.includes('websocket') || 
            serialized.includes('vite') || 
            serialized.includes('HMR') ||
            serialized.includes('StreamLogs') ||
            serialized.includes('Failed to load resource') ||
            serialized.includes('offline') ||
            serialized.includes('NOT_FOUND') ||
            serialized.includes('backend') ||
            serialized.includes('kernel') ||
            serialized.includes('tf') ||
            serialized.includes('faceapi') ||
            serialized.includes('registered') ||
            serialized.includes('wasm') ||
            serialized.includes('cpu') ||
            serialized.includes('webgl') ||
            serialized.includes('Biometric')
          ) {
            // Keep it silently inside a background trace instead of a screaming red console error row
            console.debug.apply(console, args);
            return;
          }
          originalError.apply(console, args);
        };

        console.warn = function() {
          const args = Array.prototype.slice.call(arguments);
          const serialized = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          if (
            serialized.includes('WebSocket') || 
            serialized.includes('websocket') || 
            serialized.includes('vite') || 
            serialized.includes('HMR') ||
            serialized.includes('offline') ||
            serialized.includes('NOT_FOUND') ||
            serialized.includes('backend') ||
            serialized.includes('kernel') ||
            serialized.includes('tf') ||
            serialized.includes('faceapi') ||
            serialized.includes('registered') ||
            serialized.includes('wasm') ||
            serialized.includes('cpu') ||
            serialized.includes('webgl') ||
            serialized.includes('Biometric') ||
            serialized.includes('Registration')
          ) {
            console.debug.apply(console, args);
            return;
          }
          originalWarn.apply(console, args);
        };

        // Monkey-patch WebSocket construction to suppress any system connection failures silently
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          class WrappedWebSocket extends OriginalWebSocket {
            constructor(url, protocols) {
              if (protocols !== undefined) {
                super(url, protocols);
              } else {
                super(url);
              }
              // Intercept the asynchronous connection failures to prevent noisy platform logs
              this.addEventListener('error', function(errEvent) {
                if (errEvent && typeof errEvent.preventDefault === 'function') {
                  errEvent.preventDefault();
                }
              });
            }
          }
          window.WebSocket = WrappedWebSocket;
        }
      })();
    </script>
  </head>
  <body class="bg-[#0d1117] text-gray-100 antialiased selection:bg-emerald-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
